name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The personal forge's runner also reads .github/workflows; these jobs run on GitHub only.
jobs:
  lint:
    name: Lint and test
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1" "shellcheck-py==0.10.0.1"
      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: yamllint
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml glkvm_relay/config.yaml glkvm_relay/build.yaml glkvm_relay/translations/en.yaml
          .github/workflows/ci.yml .gitea/workflows/validate.yml
      - name: shellcheck
        run: shellcheck glkvm_relay/run.sh tests/turn_rotation_test.sh tests/run_image.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: glkvm_relay/Dockerfile
          failure-threshold: info
      - name: TURN credential rotation
        run: bash tests/turn_rotation_test.sh
      - name: App linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./glkvm_relay

  build:
    name: Build and run amd64
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: >-
          docker build --pull --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.24
          --build-arg BUILD_ARCH=amd64 -t glkvm-relay:ci glkvm_relay
      # The image starts as the Supervisor starts it, answers the LAN probe and logs no credential.
      - name: Run
        run: bash tests/run_image.sh glkvm-relay:ci
