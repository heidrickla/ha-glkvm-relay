name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The personal forge's runner also reads .github/workflows; these jobs run on GitHub only.
jobs:
  lint:
    name: Lint and test
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1" "shellcheck-py==0.10.0.1"
      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: yamllint
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml glkvm_relay/config.yaml glkvm_relay/translations/en.yaml
          .github/workflows/ci.yml .gitea/workflows/validate.yml
      - name: shellcheck
        run: shellcheck glkvm_relay/run.sh tests/turn_rotation_test.sh tests/turn_peers_test.sh tests/run_image.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: glkvm_relay/Dockerfile
          failure-threshold: info
      - name: TURN credential rotation
        run: bash tests/turn_rotation_test.sh
      - name: App linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./glkvm_relay

  # aarch64 builds on GitHub's Arm runner, so the image is made as on a Raspberry Pi or Home Assistant
  # Green, with the build stages on the target platform itself.
  build:
    name: Build and run ${{ matrix.arch }}
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-26.04
          - arch: aarch64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: >-
          docker buildx build --load --pull --platform ${{ matrix.platform }}
          --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci
          -t glkvm-relay:ci glkvm_relay
      # The image starts as on a fresh install, answers the LAN probe, logs no credential, runs the
      # learned TURN peer test, and relays to a private peer only once a KVM registered from it.
      - name: Run
        run: |
          docker image inspect --format '{{.Architecture}}' glkvm-relay:ci | grep -qxF "$(basename ${{ matrix.platform }})"
          { docker run --rm --entrypoint /usr/bin/rttys glkvm-relay:ci 2>&1 || true; } | grep -m1 -F "Go OS/Arch: ${{ matrix.platform }}"
          bash tests/run_image.sh glkvm-relay:ci
