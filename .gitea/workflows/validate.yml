name: Lint, test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - uses: actions/setup-python@v5
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # Pinned and pip-installed into a venv of this job's own: the runner's
      # Python toolcache is shared with other repos and carries their packages.
      - name: Install
        timeout-minutes: 15
        run: >-
          python -m venv "$RUNNER_TEMP/venv" &&
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1"
          "shellcheck-py==0.10.0.1"

      - name: ruff
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m ruff check .
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check .

      - name: yamllint
        timeout-minutes: 15
        run: >-
          "$RUNNER_TEMP/venv/bin/yamllint" -d "{extends: relaxed, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml glkvm_relay/config.yaml glkvm_relay/translations/en.yaml
          .gitea/workflows/validate.yml .github/workflows/ci.yml

      - name: shellcheck
        timeout-minutes: 15
        run: >-
          "$RUNNER_TEMP/venv/bin/shellcheck" glkvm_relay/run.sh tests/turn_rotation_test.sh tests/turn_peers_test.sh tests/run_image.sh

      - name: TURN credential rotation
        timeout-minutes: 15
        run: bash tests/turn_rotation_test.sh

  # A job of its own: after setup-python the forge's runner hands its glibc
  # toolcache PATH to the linter's Alpine container, where Python cannot load.
  app-lint:
    name: App linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - name: App linter
        timeout-minutes: 15
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./glkvm_relay

  # The image for each architecture with the arguments the Supervisor passes, built by BuildKit as the
  # Supervisor builds it; rttys cross-compiles on the host, so only the final stage runs under QEMU.
  # The job reaches the forge host's Docker daemon: the image and the test containers carry the run's
  # id and are removed when the job ends.
  build:
    name: Build and run ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    env:
      TAG: glkvm-relay-ci:${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        timeout-minutes: 10
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 10
      - name: Build
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./glkvm_relay
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=ci
          load: true
          tags: ${{ env.TAG }}
          push: false
      # The image is the platform asked for, rttys reports it, and the add-on passes the image test.
      - name: Run
        timeout-minutes: 20
        run: |
          docker image inspect --format '{{.Architecture}}' "$TAG" | grep -qxF "$(basename ${{ matrix.platform }})"
          # rttys stops at once with no database; its first lines name the platform it runs on.
          { docker run --rm --platform ${{ matrix.platform }} --entrypoint /usr/bin/rttys "$TAG" 2>&1 || true; } \
            | grep -m1 -F "Go OS/Arch: ${{ matrix.platform }}"
          bash tests/run_image.sh "$TAG"
      - name: Remove the image
        if: always()
        run: docker image rm -f "$TAG" > /dev/null 2>&1 || true
