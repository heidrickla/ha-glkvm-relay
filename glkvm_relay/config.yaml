name: GLKVM Relay
version: "0.5.0"
slug: glkvm_relay
description: Self-hosted GLKVM Cloud relay (rttys) and its TURN server for GL.iNet KVMs
url: https://github.com/heidrickla/ha-glkvm-relay
arch:
  - amd64
  - aarch64
startup: services
init: false
host_network: true
hassio_api: true
webui: https://[HOST]:[PORT:443]/
map:
  - type: ssl
    read_only: true
# The two values people need are shown on the Configuration tab; empty ones are generated on the
# first start. Every other option has a working default and is listed with the unused optional ones.
options:
  password: ""
  device_token: ""
schema:
  password: password?
  device_token: password?
  admin_name: match(^[A-Za-z0-9._-]{1,32}$)?
  access_ip: str?
  web_port: port?
  proxy_port: port?
  device_port: port?
  turn_port: port?
  turn_learn_peers: bool?
  turn_allowed_peers:
    - match(^[0-9]{1,3}(\.[0-9]{1,3}){3}(-[0-9]{1,3}(\.[0-9]{1,3}){3})?$)?
  turn_secret_generation: int(1,)?
  certfile: str?
  keyfile: str?
